packages:
  - apps/*
  - packages/*
  - tools/*

# Shared versions for dependencies used by more than one workspace.
catalog:
  '@types/node': ^24.0.0
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  eslint: ^10.11.0
  react: ^19.3.0
  react-dom: ^19.3.0
  # typescript-eslint supports TypeScript <6.1; TypeScript does not follow semver.
  typescript: ~6.0.3
  vite: ^8.3.0
  vitest: ^5.0.3
  zod: ^4.6.0

# Dependency install scripts are opt-in (strictDepBuilds is on by default since pnpm 11).
allowBuilds:
  # Its postinstall only checks that the native binary loads and falls back to WebAssembly;
  # the binary for each platform arrives as an optional dependency.
  '@swc/core': false
  # Its postinstall only installs git hooks; the root `prepare` script does that explicitly.
  lefthook: false
  # Prisma: a Node version check, and the download of the schema engine that Migrate runs.
  '@prisma/engines': true
  prisma: true
