# The host nginx in front of the compose stack (docs/deploy.md). The containers listen on
# 127.0.0.1 only; this gives them their domains and TLS, and serves the demo video from disk.
#
# Install as /etc/nginx/sites-available/zz-forza-telemetry and link it from sites-enabled. The
# name sorts after the server's other sites on purpose: the first server listening on 443 is the
# default one, and these blocks must not take that over from a site that was there before.
#
# No http2 on the listen lines: before nginx 1.25 it switches the whole port, other sites included.

# Plain HTTP: certbot's challenges, and a redirect for everything else.
server {
    listen 80;
    server_name forza.mrdenzzz.ru forza-api.mrdenzzz.ru;
    access_log off;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# The web app.
server {
    listen 443 ssl;
    server_name forza.mrdenzzz.ru;
    access_log off;

    ssl_certificate /etc/letsencrypt/live/forza.mrdenzzz.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forza.mrdenzzz.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # The demo video, its poster and its telemetry track live on disk, not in the image.
    # track.json is served from its pre-compressed copy, track.json.gz, when there is one.
    location /media/ {
        alias /srv/forza-telemetry/media/;
        gzip_static on;
        gzip_types application/json;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# The API: REST, health, and the /live WebSocket.
server {
    listen 443 ssl;
    server_name forza-api.mrdenzzz.ru;
    access_log off;

    ssl_certificate /etc/letsencrypt/live/forza.mrdenzzz.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forza.mrdenzzz.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /live {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # The stream is quiet between frames when nobody drives; keep the socket open anyway.
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
